<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1980 1080">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#eef0f2" stroke-width="0.5"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#0284c7"/>
    </marker>
    <marker id="arrow-violet" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#ea580c"/>
    </marker>
    <marker id="arrow-sky" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#0ea5e9"/>
    </marker>
    <marker id="arrow-gray" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="22" markerHeight="8" refX="20" refY="4" orient="auto">
      <polygon points="0 0, 22 4, 0 8" fill="#059669"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Kalam:wght@300;400;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', monospace; }
      .hw { font-family: 'Kalam', 'Caveat', 'Comic Sans MS', cursive; font-weight: 400; }
      .hw-bold { font-family: 'Kalam', 'Caveat', 'Comic Sans MS', cursive; font-weight: 700; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fafbfc"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <g transform="translate(-55, 0)">
    <!-- Title -->
    <text x="95" y="60" fill="#0f172a" font-size="42" font-weight="700">图 6. 调优决策树：从"效果不理想"到具体调优方向</text>
    <text x="95" y="98" fill="#64748b" font-size="22">先按训练集 / 验证集 / 测试集表现把问题分到四类，再统一回到数据、模型、训练三个层面选取具体调优手段</text>

    <!-- ===== Row 1: Start + 4 Decisions (y center = 260) ===== -->
    <!-- Start -->
    <g filter="url(#shadow)">
      <rect x="80" y="190" width="240" height="140" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
      <rect x="80" y="190" width="240" height="32" rx="14" fill="#e0f2fe"/>
      <rect x="80" y="210" width="240" height="12" fill="#e0f2fe"/>
      <line x1="80" y1="222" x2="320" y2="222" stroke="#0284c7" stroke-width="2.5"/>
      <text x="200" y="212" fill="#0284c7" font-size="18" font-weight="600" text-anchor="middle">起点</text>
    </g>
    <text x="200" y="278" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">模型效果</text>
    <text x="200" y="304" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">不理想</text>

    <!-- Q1 训练集? -->
    <g filter="url(#shadow)">
      <polygon points="500,190 660,260 500,330 340,260" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="500" y="252" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">Q1 训练集</text>
      <text x="500" y="272" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">表现差？</text>
      <text x="500" y="294" fill="#475569" font-size="13" text-anchor="middle">欠拟合信号</text>
    </g>

    <!-- Q2 验证集? -->
    <g filter="url(#shadow)">
      <polygon points="860,190 1020,260 860,330 700,260" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="860" y="252" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">Q2 验证集</text>
      <text x="860" y="272" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">表现差？</text>
      <text x="860" y="294" fill="#475569" font-size="13" text-anchor="middle">过拟合信号</text>
    </g>

    <!-- Q3 测试集? -->
    <g filter="url(#shadow)">
      <polygon points="1220,190 1380,260 1220,330 1060,260" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="1220" y="252" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">Q3 测试集</text>
      <text x="1220" y="272" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">表现差？</text>
      <text x="1220" y="294" fill="#475569" font-size="13" text-anchor="middle">泛化信号</text>
    </g>

    <!-- Q4 指标偏差? -->
    <g filter="url(#shadow)">
      <polygon points="1580,190 1740,260 1580,330 1420,260" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <text x="1580" y="252" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">Q4 指标定义</text>
      <text x="1580" y="272" fill="#7c3aed" font-size="18" font-weight="700" text-anchor="middle">有偏差？</text>
      <text x="1580" y="294" fill="#475569" font-size="13" text-anchor="middle">目标偏差信号</text>
    </g>

    <!-- Row 1 horizontal arrows -->
    <line x1="320" y1="260" x2="340" y2="260" stroke="#0284c7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <line x1="660" y1="260" x2="700" y2="260" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
    <line x1="1020" y1="260" x2="1060" y2="260" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/>
    <line x1="1380" y1="260" x2="1420" y2="260" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-violet)"/>

    <!-- Q-否 labels (above) -->
    <g transform="translate(670, 222)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="18" y="4" fill="#7c3aed" font-size="14" font-weight="600" text-anchor="middle">否</text>
    </g>
    <g transform="translate(1030, 222)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="18" y="4" fill="#7c3aed" font-size="14" font-weight="600" text-anchor="middle">否</text>
    </g>
    <g transform="translate(1390, 222)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="18" y="4" fill="#7c3aed" font-size="14" font-weight="600" text-anchor="middle">否</text>
    </g>

    <!-- ===== Row 2: 4 problem branches (y center = 510) ===== -->
    <!-- A1 偏差高 (红色) -->
    <g filter="url(#shadow)">
      <rect x="340" y="420" width="320" height="180" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <rect x="340" y="420" width="320" height="32" rx="14" fill="#fee2e2"/>
      <rect x="340" y="440" width="320" height="12" fill="#fee2e2"/>
      <line x1="340" y1="452" x2="660" y2="452" stroke="#dc2626" stroke-width="2.5"/>
      <text x="500" y="442" fill="#dc2626" font-size="18" font-weight="600" text-anchor="middle">A1 · 偏差高（欠拟合）</text>
    </g>
    <text x="500" y="490" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 模型容量不足</text>
    <text x="500" y="518" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 特征不足</text>
    <text x="500" y="546" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 训练不充分</text>
    <text x="500" y="580" fill="#64748b" font-size="14" text-anchor="middle" font-style="italic">训练损失与验证损失同步高</text>

    <!-- A2 方差高 (橙色) -->
    <g filter="url(#shadow)">
      <rect x="700" y="420" width="320" height="180" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <rect x="700" y="420" width="320" height="32" rx="14" fill="#ffedd5"/>
      <rect x="700" y="440" width="320" height="12" fill="#ffedd5"/>
      <line x1="700" y1="452" x2="1020" y2="452" stroke="#ea580c" stroke-width="2.5"/>
      <text x="860" y="442" fill="#ea580c" font-size="18" font-weight="600" text-anchor="middle">A2 · 方差高（过拟合）</text>
    </g>
    <text x="860" y="490" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 数据增广</text>
    <text x="860" y="518" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 正则化 / Dropout</text>
    <text x="860" y="546" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 早停</text>
    <text x="860" y="580" fill="#64748b" font-size="14" text-anchor="middle" font-style="italic">训练低 / 验证高的剪刀差</text>

    <!-- A3 分布偏移 (蓝色) -->
    <g filter="url(#shadow)">
      <rect x="1060" y="420" width="320" height="180" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
      <rect x="1060" y="420" width="320" height="32" rx="14" fill="#e0f2fe"/>
      <rect x="1060" y="440" width="320" height="12" fill="#e0f2fe"/>
      <line x1="1060" y1="452" x2="1380" y2="452" stroke="#0ea5e9" stroke-width="2.5"/>
      <text x="1220" y="442" fill="#0ea5e9" font-size="18" font-weight="600" text-anchor="middle">A3 · 分布偏移</text>
    </g>
    <text x="1220" y="490" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 数据分布对齐</text>
    <text x="1220" y="518" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 域适应</text>
    <text x="1220" y="546" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 重新采样</text>
    <text x="1220" y="580" fill="#64748b" font-size="14" text-anchor="middle" font-style="italic">训练验证好 / 测试差</text>

    <!-- A4 指标偏差 (灰色) -->
    <g filter="url(#shadow)">
      <rect x="1420" y="420" width="320" height="180" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
      <rect x="1420" y="420" width="320" height="32" rx="14" fill="#f1f5f9"/>
      <rect x="1420" y="440" width="320" height="12" fill="#f1f5f9"/>
      <line x1="1420" y1="452" x2="1740" y2="452" stroke="#64748b" stroke-width="2.5"/>
      <text x="1580" y="442" fill="#64748b" font-size="18" font-weight="600" text-anchor="middle">A4 · 指标定义偏差</text>
    </g>
    <text x="1580" y="490" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 复核评估指标</text>
    <text x="1580" y="518" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 复核真实目标</text>
    <text x="1580" y="546" fill="#0f172a" font-size="16" font-weight="600" text-anchor="middle">→ 复核样本范围</text>
    <text x="1580" y="580" fill="#64748b" font-size="14" text-anchor="middle" font-style="italic">三集都好但用户仍不满意</text>

    <!-- Q 是/否 → A 的连接 -->
    <line x1="500" y1="330" x2="500" y2="420" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)"/>
    <g transform="translate(508, 380)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#dc2626" stroke-width="1.2"/>
      <text x="18" y="4" fill="#dc2626" font-size="14" font-weight="600" text-anchor="middle">是</text>
    </g>

    <line x1="860" y1="330" x2="860" y2="420" stroke="#ea580c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <g transform="translate(868, 380)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#ea580c" stroke-width="1.2"/>
      <text x="18" y="4" fill="#ea580c" font-size="14" font-weight="600" text-anchor="middle">是</text>
    </g>

    <line x1="1220" y1="330" x2="1220" y2="420" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-sky)"/>
    <g transform="translate(1228, 380)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="18" y="4" fill="#0ea5e9" font-size="14" font-weight="600" text-anchor="middle">是</text>
    </g>

    <line x1="1580" y1="330" x2="1580" y2="420" stroke="#64748b" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-gray)"/>
    <g transform="translate(1588, 380)">
      <rect x="0" y="-12" width="36" height="22" rx="4" fill="rgba(255,255,255,0.95)" stroke="#64748b" stroke-width="1.2"/>
      <text x="18" y="4" fill="#64748b" font-size="14" font-weight="600" text-anchor="middle">是</text>
    </g>

    <!-- ===== Row 3: Fix 三层面调优方向（汇合点） ===== -->
    <g filter="url(#shadow)">
      <rect x="240" y="670" width="1500" height="200" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
      <rect x="240" y="670" width="1500" height="36" rx="14" fill="#d1fae5"/>
      <rect x="240" y="694" width="1500" height="12" fill="#d1fae5"/>
      <line x1="240" y1="706" x2="1740" y2="706" stroke="#059669" stroke-width="2.5"/>
      <text x="990" y="696" fill="#059669" font-size="22" font-weight="700" text-anchor="middle">汇合点：三层面调优方向（无论哪类问题都从这三个层面找具体手段）</text>
    </g>

    <!-- 三层面 sub-cards -->
    <text x="500" y="755" fill="#059669" font-size="22" font-weight="700">📊 数据</text>
    <text x="500" y="785" fill="#0f172a" font-size="17">更多 / 更高质量 / 重新标注</text>
    <text x="500" y="810" fill="#0f172a" font-size="17">数据增广 / 分布对齐</text>
    <text x="500" y="845" fill="#64748b" font-size="14" font-style="italic">覆盖度与质量优先</text>

    <text x="990" y="755" fill="#059669" font-size="22" font-weight="700" text-anchor="middle">🧠 模型</text>
    <text x="990" y="785" fill="#0f172a" font-size="17" text-anchor="middle">更大容量 / 更好的归纳偏置</text>
    <text x="990" y="810" fill="#0f172a" font-size="17" text-anchor="middle">激活函数 / 归一化 / 残差</text>
    <text x="990" y="845" fill="#64748b" font-size="14" font-style="italic" text-anchor="middle">结构匹配任务</text>

    <text x="1480" y="755" fill="#059669" font-size="22" font-weight="700" text-anchor="end">⚙️ 训练</text>
    <text x="1480" y="785" fill="#0f172a" font-size="17" text-anchor="end">调整学习率 / 训练时长</text>
    <text x="1480" y="810" fill="#0f172a" font-size="17" text-anchor="end">优化器选择 / 正则化强度</text>
    <text x="1480" y="845" fill="#64748b" font-size="14" font-style="italic" text-anchor="end">调度策略与早停</text>

    <!-- A1→Fix, A2→Fix, A3→Fix, A4→Fix -->
    <path d="M 500 600 Q 500 635 500 670" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <path d="M 860 600 Q 860 635 860 670" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <path d="M 1220 600 Q 1220 635 1220 670" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <path d="M 1580 600 Q 1580 635 1580 670" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-green)"/>

    <!-- ===== Footer ===== -->
    <g transform="translate(95, 910)">
      <rect x="0" y="0" width="1770" height="100" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="24" y="35" fill="#92400e" font-size="22" font-weight="700">如何使用这张决策树？</text>
      <text x="24" y="68" fill="#0f172a" font-size="20" class="hw">从「模型效果不理想」开始，按 Q1→Q2→Q3→Q4 顺序判断，定位到具体问题分支；</text>
      <text x="24" y="92" fill="#0f172a" font-size="20" class="hw">无论落在哪一类，最终调优手段都从「数据 / 模型 / 训练」三个层面选取。</text>
    </g>
  </g>
</svg>