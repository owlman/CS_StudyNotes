<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', sans-serif">
  <rect width="1600" height="900" fill="#F5E6C8"/>

  <text x="800" y="72" font-size="44" font-weight="700" fill="#6B4423" text-anchor="middle">AI 研究方法的演变路径</text>
  <line x1="620" y1="96" x2="980" y2="96" stroke="#D97A47" stroke-width="3" stroke-linecap="round"/>
  <text x="800" y="126" font-size="20" fill="#8A7355" text-anchor="middle">四个阶段、三次转向，每一次转向都由上一阶段暴露的边界逼出来</text>

  <!-- 阶段一 -->
  <rect x="70" y="150" width="335" height="330" rx="14" fill="#FFF8E8" stroke="#5A8AAA" stroke-width="3"/>
  <text x="92" y="200" font-size="24" font-weight="700" fill="#3F6486">符号主义</text>
  <text x="92" y="230" font-size="17" fill="#7A6A55">Symbolism · 1950s–1980s</text>
  <line x1="92" y1="248" x2="192" y2="248" stroke="#5A8AAA" stroke-width="2" stroke-dasharray="9,7"/>
  <text x="92" y="286" font-size="19" font-weight="700" fill="#6B4423">知识编码 + 逻辑推理</text>
  <text x="92" y="316" font-size="19" fill="#6B4423">人工把知识写成规则</text>
  <text x="92" y="358" font-size="18" fill="#7A6A55">专家系统 · 物理符号假设</text>
  <text x="92" y="386" font-size="18" fill="#7A6A55">逻辑推理 · 搜索</text>
  <line x1="92" y1="410" x2="383" y2="410" stroke="#D9CBB0" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="92" y="440" font-size="17" fill="#B4592A">边界：知识获取瓶颈、脆性</text>
  <text x="92" y="466" font-size="17" fill="#B4592A">组合爆炸</text>

  <!-- 阶段二 -->
  <rect x="445" y="150" width="335" height="330" rx="14" fill="#FFF8E8" stroke="#7A8C6F" stroke-width="3"/>
  <text x="467" y="200" font-size="24" font-weight="700" fill="#556B4C">概率转向</text>
  <text x="467" y="230" font-size="17" fill="#7A6A55">Probabilistic · 1980s–2000s</text>
  <line x1="467" y1="248" x2="567" y2="248" stroke="#7A8C6F" stroke-width="2" stroke-dasharray="9,7"/>
  <text x="467" y="286" font-size="19" font-weight="700" fill="#6B4423">不确定性下的推理</text>
  <text x="467" y="316" font-size="19" fill="#6B4423">用概率分布建模世界</text>
  <text x="467" y="358" font-size="18" fill="#7A6A55">贝叶斯网 · HMM · CRF</text>
  <text x="467" y="386" font-size="18" fill="#7A6A55">EM 算法 · 噪声信道模型</text>
  <line x1="467" y1="410" x2="758" y2="410" stroke="#D9CBB0" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="467" y="440" font-size="17" fill="#B4592A">边界：模型容量与手工设计</text>
  <text x="467" y="466" font-size="17" fill="#B4592A">特征仍需人来定义</text>

  <!-- 阶段三 -->
  <rect x="820" y="150" width="335" height="330" rx="14" fill="#FFF8E8" stroke="#D97A47" stroke-width="3"/>
  <text x="842" y="200" font-size="24" font-weight="700" fill="#B4592A">统计学习</text>
  <text x="842" y="230" font-size="17" fill="#7A6A55">Machine Learning · 1990s–2010s</text>
  <line x1="842" y1="248" x2="942" y2="248" stroke="#D97A47" stroke-width="2" stroke-dasharray="9,7"/>
  <text x="842" y="286" font-size="19" font-weight="700" fill="#6B4423">从数据中归纳函数</text>
  <text x="842" y="316" font-size="19" fill="#6B4423">手工特征 + 浅层模型</text>
  <text x="842" y="358" font-size="18" fill="#7A6A55">SVM · 集成方法 · 核方法</text>
  <text x="842" y="386" font-size="18" fill="#7A6A55">特征工程成为核心工作</text>
  <line x1="842" y1="410" x2="1133" y2="410" stroke="#D9CBB0" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="842" y="440" font-size="17" fill="#B4592A">边界：特征工程天花板</text>
  <text x="842" y="466" font-size="17" fill="#B4592A">任务专用、知识不迁移</text>

  <!-- 阶段四 -->
  <rect x="1195" y="150" width="335" height="330" rx="14" fill="#FFF8E8" stroke="#B9A88E" stroke-width="3"/>
  <text x="1217" y="200" font-size="24" font-weight="700" fill="#6B4423">基础模型</text>
  <text x="1217" y="230" font-size="17" fill="#7A6A55">Foundation · 2017 至今</text>
  <line x1="1217" y1="248" x2="1317" y2="248" stroke="#B9A88E" stroke-width="2" stroke-dasharray="9,7"/>
  <text x="1217" y="286" font-size="19" font-weight="700" fill="#6B4423">预训练 + 涌现能力</text>
  <text x="1217" y="316" font-size="19" fill="#6B4423">一个模型适配多任务</text>
  <text x="1217" y="358" font-size="18" fill="#7A6A55">Transformer · RLHF · Agent</text>
  <text x="1217" y="386" font-size="18" fill="#7A6A55">测试时计算 · 多模态</text>
  <line x1="1217" y1="410" x2="1508" y2="410" stroke="#D9CBB0" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="1217" y="440" font-size="17" fill="#B4592A">边界：价值对齐、长程规划</text>
  <text x="1217" y="466" font-size="17" fill="#B4592A">物理常识与幻觉</text>

  <!-- 时间轴 -->
  <line x1="90" y1="530" x2="1490" y2="530" stroke="#B9A88E" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1510,530 1486,519 1486,541" fill="#B9A88E"/>
  <circle cx="237" cy="530" r="13" fill="#5A8AAA"/>
  <circle cx="612" cy="530" r="13" fill="#7A8C6F"/>
  <circle cx="987" cy="530" r="13" fill="#D97A47"/>
  <circle cx="1362" cy="530" r="13" fill="#6B4423"/>

  <!-- 三次转向 -->
  <rect x="262" y="570" width="330" height="96" rx="10" fill="#F0EFE6" stroke="#B9A88E" stroke-width="2"/>
  <text x="427" y="606" font-size="20" font-weight="700" fill="#6B4423" text-anchor="middle">知识驱动 → 数据驱动</text>
  <text x="427" y="638" font-size="17" fill="#7A6A55" text-anchor="middle">从人工写规则到从数据学</text>

  <rect x="637" y="570" width="330" height="96" rx="10" fill="#F0EFE6" stroke="#B9A88E" stroke-width="2"/>
  <text x="802" y="606" font-size="20" font-weight="700" fill="#6B4423" text-anchor="middle">专用系统 → 通用基础模型</text>
  <text x="802" y="638" font-size="17" fill="#7A6A55" text-anchor="middle">一个任务一个模型到先预训练</text>

  <rect x="1012" y="570" width="330" height="96" rx="10" fill="#F0EFE6" stroke="#B9A88E" stroke-width="2"/>
  <text x="1177" y="606" font-size="20" font-weight="700" fill="#6B4423" text-anchor="middle">独立组件 → 端到端学习</text>
  <text x="1177" y="638" font-size="17" fill="#7A6A55" text-anchor="middle">多模块串联到原始输入直出</text>

  <text x="800" y="736" font-size="20" fill="#6B4423" text-anchor="middle">每一次转向，都是把上一阶段靠人工完成的那部分工作，交给数据与算力</text>
  <text x="800" y="800" font-size="19" font-style="italic" fill="#8A7355" text-anchor="middle">而人工环节并没有消失，只是向上游迁移：规则工程师 → 标注者、架构师、对齐工程师</text>
</svg>
