  <text x="1200" y="758" font-size="23" text-anchor="middle" fill="#6B4423">目标句子（自回归，右移一位）</text>
  <line x1="1200" y1="690" x2="1200" y2="716" stroke="#7A8C6F" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/>
