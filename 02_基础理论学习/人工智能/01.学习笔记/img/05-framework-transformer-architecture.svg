  <text x="1200" y="847" font-size="23" text-anchor="middle" fill="#6B4423">Linear + Softmax → 词表概率分布</text>
  <path d="M 585 235 C 700 190 820 205 912 240" fill="none" stroke="#7A8C6F" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/>
  <text x="748" y="180" font-size="20" text-anchor="middle" fill="#7A8C6F">Encoder 输出作为 K、V</text>
  <text x="800" y="895" font-size="20" text-anchor="middle" fill="#8B6F47" font-style="italic">每个 Block 均含残差连接与层归一化</text>
</svg>
