<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L11,6 L0,11 z" fill="#5A8AAA"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F5E6C8"/>

  <text x="800" y="72" font-size="42" font-weight="700" fill="#6B4423" text-anchor="middle">符号主义 vs 联结主义：两种智能范式</text>
  <line x1="580" y1="96" x2="1020" y2="96" stroke="#D97A47" stroke-width="3" stroke-linecap="round"/>

  <!-- 左：符号主义 -->
  <rect x="70" y="130" width="680" height="620" rx="14" fill="#FFF8E8" stroke="#5A8AAA" stroke-width="3"/>
  <rect x="70" y="130" width="680" height="64" rx="14" fill="#E4EDF4"/>
  <circle cx="120" cy="162" r="22" fill="#5A8AAA"/>
  <text x="120" y="170" font-size="20" font-weight="700" fill="#FFF8E8" text-anchor="middle">S</text>
  <text x="158" y="172" font-size="27" font-weight="700" fill="#3F6486">符号主义 Symbolism</text>

  <text x="100" y="240" font-size="21" font-weight="700" fill="#6B4423">核心主张</text>
  <text x="100" y="274" font-size="20" fill="#6B4423">智能 = 符号操作与逻辑推理</text>

  <rect x="110" y="330" width="215" height="64" rx="8" fill="#F0EFE6" stroke="#5A8AAA" stroke-width="2"/>
  <text x="217" y="370" font-size="18" fill="#3F6486" text-anchor="middle">领域专家编码知识</text>
  <line x1="325" y1="362" x2="392" y2="362" stroke="#5A8AAA" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="400" y="330" width="245" height="64" rx="8" fill="#F0EFE6" stroke="#5A8AAA" stroke-width="2"/>
  <text x="522" y="370" font-size="18" fill="#3F6486" text-anchor="middle">IF-THEN 规则库</text>
  <line x1="522" y1="396" x2="522" y2="426" stroke="#5A8AAA" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="400" y="432" width="245" height="64" rx="8" fill="#F0EFE6" stroke="#5A8AAA" stroke-width="2"/>
  <text x="522" y="472" font-size="18" fill="#3F6486" text-anchor="middle">推理引擎求解</text>

  <text x="100" y="552" font-size="21" font-weight="700" fill="#B4592A">暴露的边界</text>
  <text x="100" y="588" font-size="18" fill="#7A6A55">· 知识获取瓶颈：隐性知识难以写成规则</text>
  <text x="100" y="622" font-size="18" fill="#7A6A55">· 脆性：超出规则边界即完全失效</text>
  <text x="100" y="656" font-size="18" fill="#7A6A55">· 组合爆炸：规则越多，搜索越慢</text>

  <text x="100" y="712" font-size="18" font-style="italic" fill="#8A7355">代表系统：专家系统、GPS、逻辑理论家</text>

  <!-- 中间 VS -->
  <circle cx="800" cy="420" r="54" fill="#F0EFE6" stroke="#B9A88E" stroke-width="3"/>
  <text x="800" y="433" font-size="30" font-weight="700" fill="#8A7355" text-anchor="middle">VS</text>

  <!-- 右：联结主义 -->
  <rect x="850" y="130" width="680" height="620" rx="14" fill="#FFF8E8" stroke="#7A8C6F" stroke-width="3"/>
  <rect x="850" y="130" width="680" height="64" rx="14" fill="#EFF3EA"/>
  <circle cx="900" cy="162" r="22" fill="#7A8C6F"/>
  <text x="900" y="170" font-size="20" font-weight="700" fill="#FFF8E8" text-anchor="middle">C</text>
  <text x="938" y="172" font-size="27" font-weight="700" fill="#556B4C">联结主义 Connectionism</text>

  <text x="880" y="240" font-size="21" font-weight="700" fill="#6B4423">核心主张</text>
  <text x="880" y="274" font-size="20" fill="#6B4423">智能 = 神经元连接的涌现结果</text>

  <!-- 神经网络示意 -->
  <line x1="960" y1="352" x2="1020" y2="430" stroke="#B9A88E" stroke-width="2"/>
  <line x1="960" y1="352" x2="1120" y2="430" stroke="#B9A88E" stroke-width="2"/>
  <line x1="1060" y1="352" x2="1020" y2="430" stroke="#B9A88E" stroke-width="2"/>
  <line x1="1060" y1="352" x2="1120" y2="430" stroke="#B9A88E" stroke-width="2"/>
  <line x1="1160" y1="352" x2="1020" y2="430" stroke="#B9A88E" stroke-width="2"/>
  <line x1="1160" y1="352" x2="1120" y2="430" stroke="#B9A88E" stroke-width="2"/>
  <line x1="1020" y1="456" x2="1070" y2="540" stroke="#B9A88E" stroke-width="2"/>
  <line x1="1120" y1="456" x2="1070" y2="540" stroke="#B9A88E" stroke-width="2"/>

  <circle cx="960" cy="345" r="24" fill="#EFF3EA" stroke="#7A8C6F" stroke-width="2.5"/>
  <circle cx="1060" cy="345" r="24" fill="#EFF3EA" stroke="#7A8C6F" stroke-width="2.5"/>
  <circle cx="1160" cy="345" r="24" fill="#EFF3EA" stroke="#7A8C6F" stroke-width="2.5"/>
  <text x="960" y="392" font-size="16" fill="#8A7355" text-anchor="middle">x₁</text>
  <text x="1060" y="392" font-size="16" fill="#8A7355" text-anchor="middle">x₂</text>
  <text x="1160" y="392" font-size="16" fill="#8A7355" text-anchor="middle">x₃</text>

  <circle cx="1020" cy="445" r="26" fill="#D3DEC9" stroke="#7A8C6F" stroke-width="2.5"/>
  <circle cx="1120" cy="445" r="26" fill="#D3DEC9" stroke="#7A8C6F" stroke-width="2.5"/>
  <text x="1230" y="450" font-size="17" fill="#8A7355">隐藏层</text>

  <circle cx="1070" cy="556" r="26" fill="#7A8C6F" stroke="#556B4C" stroke-width="2.5"/>
  <text x="1180" y="562" font-size="17" fill="#8A7355">输出 y</text>

  <text x="880" y="628" font-size="19" font-weight="700" fill="#556B4C">权重从数据中自动学习</text>
  <text x="880" y="660" font-size="19" fill="#7A6A55">无需人工编码任何规则</text>
  <text x="880" y="700" font-size="18" font-style="italic" fill="#8A7355">代表系统：感知机、CNN、Transformer</text>

  <text x="800" y="812" font-size="20" font-style="italic" fill="#8A7355" text-anchor="middle">核心张力：知识工程 vs. 数据驱动</text>
</svg>
