  <text x="815" y="788" font-size="21" text-anchor="middle" fill="#6B4423">sin 与 cos 相差四分之一周期：偶数维给出正弦项，奇数维给出余弦项，</text>
  <text x="815" y="818" font-size="21" text-anchor="middle" fill="#6B4423">两者交错排列进同一个位置向量，配对出现才能把一个位置完整地钉住。</text>
  <text x="815" y="844" font-size="19" text-anchor="middle" fill="#8B6F47">起点处 pos = 0：sin 取 0，cos 取 1，两条曲线的错位一眼可辨。</text>
  <text x="815" y="884" font-size="20" text-anchor="middle" fill="#8B6F47" font-style="italic">Vaswani et al. (2017)：原论文采用的固定位置编码</text>
</svg>
