<text x="427.5" y="477" class="t-desc" text-anchor="middle">test_ambiguous_prompt.py · 过度推断</text>
<rect x="630" y="434" width="355" height="58" rx="6" fill="#0f172a"/>
<rect x="630" y="434" width="355" height="58" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="807.5" y="459" class="t-name" text-anchor="middle">流式完整性</text>
<text x="807.5" y="477" class="t-desc" text-anchor="middle">test_streaming.py · 关键短语命中率</text>
<rect x="1010" y="434" width="355" height="58" rx="6" fill="#0f172a"/>
<rect x="1010" y="434" width="355" height="58" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
<text x="1187.5" y="459" class="t-name" text-anchor="middle">知识边界</text>
<text x="1187.5" y="477" class="t-desc" text-anchor="middle">test_knowledge_boundary.py · 幻觉</text>
