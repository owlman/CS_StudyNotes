<rect x="250" y="232" width="255" height="58" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="377.5" y="257" class="t-name" text-anchor="middle">非流式生成</text>
<text x="377.5" y="275" class="t-desc" text-anchor="middle">POST /api/generate</text>
<rect x="530" y="232" width="255" height="58" rx="6" fill="#0f172a"/>
<rect x="530" y="232" width="255" height="58" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="657.5" y="257" class="t-name" text-anchor="middle">对话接口</text>
<text x="657.5" y="275" class="t-desc" text-anchor="middle">POST /api/chat</text>
<rect x="810" y="232" width="255" height="58" rx="6" fill="#0f172a"/>
<rect x="810" y="232" width="255" height="58" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="937.5" y="257" class="t-name" text-anchor="middle">流式输出</text>
<text x="937.5" y="275" class="t-desc" text-anchor="middle">stream=true 逐 token</text>
<rect x="1090" y="232" width="255" height="58" rx="6" fill="#0f172a"/>
<rect x="1090" y="232" width="255" height="58" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
