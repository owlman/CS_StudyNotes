<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', sans-serif">
  <rect width="1600" height="900" fill="#F5E6C8"/>

  <text x="800" y="90" text-anchor="middle" font-size="44" font-weight="700" fill="#6B4423">LLM 本地部署与测试的端到端链路</text>
  <line x1="600" y1="113" x2="1000" y2="113" stroke="#D97A47" stroke-width="3" stroke-linecap="round"/>
  <text x="800" y="150" text-anchor="middle" font-size="24" fill="#8A6A4F">部署准备 → API 调用 → 六类测试 → 后端选型：一条链路串起本文的全部实验</text>

  <rect x="520" y="182" width="560" height="70" rx="10" fill="#FFF8E8" stroke="#D97A47" stroke-width="2.5"/>
  <text x="800" y="226" text-anchor="middle" font-size="27" fill="#6B4423">从零到可用：部署 → 调用 → 测试 → 选型</text>

  <path d="M800 252 L800 288" stroke="#8A6A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M230 288 L1310 288" stroke="#8A6A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M230 288 L230 322" stroke="#8A6A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M590 288 L590 322" stroke="#8A6A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M950 288 L950 322" stroke="#8A6A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M1310 288 L1310 322" stroke="#8A6A4F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <rect x="60" y="326" width="340" height="430" rx="12" fill="#FFF8E8" stroke="#7A8C6F" stroke-width="3"/>
  <text x="230" y="376" text-anchor="middle" font-size="28" font-weight="700" fill="#6B4423">① 部署准备</text>
  <text x="230" y="406" text-anchor="middle" font-size="20" fill="#7A8C6F">Ollama 工具链</text>
  <text x="230" y="470" text-anchor="middle" font-size="44" font-weight="700" fill="#7A8C6F">4 步</text>
  <line x1="90" y1="496" x2="370" y2="496" stroke="#D8C9A8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="94" cy="528" r="4" fill="#7A8C6F"/>
  <text x="112" y="535" font-size="21" fill="#6B4423">安装 Ollama</text>
  <text x="112" y="554" font-size="15" fill="#8A6A4F">Windows 安装包 · 环境变量</text>
  <circle cx="94" cy="580" r="4" fill="#7A8C6F"/>
  <text x="112" y="587" font-size="21" fill="#6B4423">拉取模型</text>
  <text x="112" y="606" font-size="15" fill="#8A6A4F">ollama pull qwen3:8b</text>
  <circle cx="94" cy="632" r="4" fill="#7A8C6F"/>
  <text x="112" y="639" font-size="21" fill="#6B4423">启动服务</text>
  <text x="112" y="658" font-size="15" fill="#8A6A4F">ollama serve · 端口 11434</text>
  <circle cx="94" cy="684" r="4" fill="#7A8C6F"/>
  <text x="112" y="691" font-size="21" fill="#6B4423">校验环境</text>
  <text x="112" y="710" font-size="15" fill="#8A6A4F">ollama list · ollama ps</text>
  <text x="230" y="742" text-anchor="middle" font-size="17" fill="#8A6A4F">后台常驻 · 端口固定</text>

  <rect x="420" y="326" width="340" height="430" rx="12" fill="#FFF8E8" stroke="#5A8AAA" stroke-width="3"/>
  <text x="590" y="376" text-anchor="middle" font-size="28" font-weight="700" fill="#6B4423">② API 调用</text>
  <text x="590" y="406" text-anchor="middle" font-size="20" fill="#5A8AAA">HTTP / JSON</text>
  <text x="590" y="470" text-anchor="middle" font-size="44" font-weight="700" fill="#5A8AAA">4 类接口</text>
  <line x1="450" y1="496" x2="730" y2="496" stroke="#D8C9A8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="454" cy="528" r="4" fill="#5A8AAA"/>
  <text x="472" y="535" font-size="21" fill="#6B4423">非流式生成</text>
  <text x="472" y="554" font-size="15" fill="#8A6A4F">POST /api/generate</text>
  <circle cx="454" cy="580" r="4" fill="#5A8AAA"/>
  <text x="472" y="587" font-size="21" fill="#6B4423">对话接口</text>
  <text x="472" y="606" font-size="15" fill="#8A6A4F">POST /api/chat</text>
  <circle cx="454" cy="632" r="4" fill="#5A8AAA"/>
  <text x="472" y="639" font-size="21" fill="#6B4423">流式输出</text>
  <text x="472" y="658" font-size="15" fill="#8A6A4F">stream=true 逐 token</text>
  <circle cx="454" cy="684" r="4" fill="#5A8AAA"/>
  <text x="472" y="691" font-size="21" fill="#6B4423">响应字段</text>
  <text x="472" y="710" font-size="15" fill="#8A6A4F">eval_count · eval_duration</text>
  <text x="590" y="742" text-anchor="middle" font-size="17" fill="#8A6A4F">程序化调用 · 链路可测</text>

  <rect x="780" y="326" width="340" height="430" rx="12" fill="#FFF8E8" stroke="#D97A47" stroke-width="3"/>
  <text x="950" y="376" text-anchor="middle" font-size="28" font-weight="700" fill="#6B4423">③ 六类测试</text>
  <text x="950" y="406" text-anchor="middle" font-size="20" fill="#D97A47">examples/llm_tests</text>
  <text x="950" y="470" text-anchor="middle" font-size="44" font-weight="700" fill="#D97A47">6 类行为</text>
  <line x1="810" y1="492" x2="1090" y2="492" stroke="#D8C9A8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="814" cy="510" r="4" fill="#D97A47"/>
  <text x="832" y="517" font-size="20" fill="#6B4423">基础调用</text>
  <text x="832" y="535" font-size="14" fill="#8A6A4F">test_basic_call.py</text>
  <circle cx="814" cy="550" r="4" fill="#D97A47"/>
  <text x="832" y="557" font-size="20" fill="#6B4423">延迟与相关</text>
  <text x="832" y="575" font-size="14" fill="#8A6A4F">test_latency.py</text>
  <circle cx="814" cy="590" r="4" fill="#D97A47"/>
  <text x="832" y="597" font-size="20" fill="#6B4423">非确定性</text>
  <text x="832" y="615" font-size="14" fill="#8A6A4F">test_nondeterminism.py</text>
  <circle cx="814" cy="630" r="4" fill="#D97A47"/>
  <text x="832" y="637" font-size="20" fill="#6B4423">模糊指令</text>
  <text x="832" y="655" font-size="14" fill="#8A6A4F">test_ambiguous_prompt.py</text>
  <circle cx="814" cy="670" r="4" fill="#D97A47"/>
  <text x="832" y="677" font-size="20" fill="#6B4423">流式完整性</text>
  <text x="832" y="695" font-size="14" fill="#8A6A4F">test_streaming.py</text>
  <circle cx="814" cy="710" r="4" fill="#D97A47"/>
  <text x="832" y="717" font-size="20" fill="#6B4423">知识边界</text>
  <text x="832" y="735" font-size="14" fill="#8A6A4F">test_knowledge_boundary.py</text>

  <rect x="1140" y="326" width="340" height="430" rx="12" fill="#FFF8E8" stroke="#9A6FB0" stroke-width="3"/>
  <text x="1310" y="376" text-anchor="middle" font-size="28" font-weight="700" fill="#6B4423">④ 后端选型</text>
  <text x="1310" y="406" text-anchor="middle" font-size="19" fill="#9A6FB0">examples/ollama_test_NPU</text>
  <text x="1310" y="470" text-anchor="middle" font-size="44" font-weight="700" fill="#9A6FB0">2 套后端</text>
  <line x1="1170" y1="496" x2="1450" y2="496" stroke="#D8C9A8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1174" cy="528" r="4" fill="#9A6FB0"/>
  <text x="1192" y="535" font-size="20" fill="#6B4423">OpenVINO 后端</text>
  <text x="1192" y="554" font-size="15" fill="#8A6A4F">NPU · iGPU · CPU</text>
  <circle cx="1174" cy="580" r="4" fill="#9A6FB0"/>
  <text x="1192" y="587" font-size="20" fill="#6B4423">Ollama 后端</text>
  <text x="1192" y="606" font-size="15" fill="#8A6A4F">CPU · iGPU (Vulkan)</text>
  <circle cx="1174" cy="632" r="4" fill="#9A6FB0"/>
  <text x="1192" y="639" font-size="20" fill="#6B4423">吞吐对比</text>
  <text x="1192" y="658" font-size="15" fill="#8A6A4F">均值 ± 极差 · 3 次独立运行</text>
  <circle cx="1174" cy="684" r="4" fill="#9A6FB0"/>
  <text x="1192" y="691" font-size="20" fill="#6B4423">干扰项排查</text>
  <text x="1192" y="710" font-size="15" fill="#8A6A4F">冷编译 · 代理 · 端口占用</text>
  <text x="1310" y="742" text-anchor="middle" font-size="17" fill="#8A6A4F">同一台机器 · 三种算力</text>

  <rect x="60" y="784" width="1420" height="96" rx="10" fill="#F5E0D0" stroke="#D97A47" stroke-width="2" stroke-dasharray="10,8"/>
  <text x="800" y="818" text-anchor="middle" font-size="24" font-weight="700" fill="#6B4423">结论：先让模型跑起来，再让它被程序调用，最后用数据决定它跑在哪块硬件上</text>
  <text x="800" y="848" text-anchor="middle" font-size="20" fill="#6B4423">脚本位置：examples/llm_tests/（六类行为测试）· examples/ollama_test_NPU/（后端选型实测）</text>
</svg>
