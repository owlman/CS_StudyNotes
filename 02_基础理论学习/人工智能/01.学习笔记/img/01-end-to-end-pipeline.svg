<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720">
<style>
  text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
  .t-title { fill:#f8fafc; font-size:18px; font-weight:700; }
  .t-sub   { fill:#94a3b8; font-size:10px; }
  .t-band  { fill:#f8fafc; font-size:13px; font-weight:700; }
  .t-bandsub { fill:#94a3b8; font-size:9px; }
  .t-name  { fill:#f8fafc; font-size:11px; font-weight:600; }
  .t-desc  { fill:#94a3b8; font-size:9px; }
  .t-flow  { fill:#94a3b8; font-size:8px; }
</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
  </marker>
  <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#0f172a"/>
<rect width="100%" height="100%" fill="url(#grid)"/>
<text x="40" y="38" class="t-title">LLM 本地部署与测试的端到端链路</text>
<text x="40" y="58" class="t-sub">部署准备 → API 调用 → 六类测试 → 后端选型：一条链路串起本文的全部实验</text>
<rect x="40" y="90" width="1320" height="94" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4" stroke-opacity="0.55"/>
<rect x="60" y="108" width="170" height="58" rx="6" fill="#0f172a"/>
<rect x="60" y="108" width="170" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
