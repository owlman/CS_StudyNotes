<text x="145.0" y="153" class="t-bandsub" text-anchor="middle">4 个步骤</text>
<rect x="250" y="108" width="255" height="58" rx="6" fill="#0f172a"/>
<rect x="250" y="108" width="255" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="377.5" y="133" class="t-name" text-anchor="middle">安装 Ollama</text>
<text x="377.5" y="151" class="t-desc" text-anchor="middle">Windows 安装包 · 环境变量</text>
<rect x="530" y="108" width="255" height="58" rx="6" fill="#0f172a"/>
<rect x="530" y="108" width="255" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="657.5" y="133" class="t-name" text-anchor="middle">拉取模型</text>
<text x="657.5" y="151" class="t-desc" text-anchor="middle">ollama pull qwen3:8b</text>
<rect x="810" y="108" width="255" height="58" rx="6" fill="#0f172a"/>
<rect x="810" y="108" width="255" height="58" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="937.5" y="133" class="t-name" text-anchor="middle">启动服务</text>
<text x="937.5" y="151" class="t-desc" text-anchor="middle">ollama serve · 端口 11434</text>
