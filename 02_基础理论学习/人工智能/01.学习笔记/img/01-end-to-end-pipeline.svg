<rect x="60" y="582" width="170" height="58" rx="6" fill="#0f172a"/>
<rect x="60" y="582" width="170" height="58" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="145.0" y="608" class="t-band" text-anchor="middle">④ 后端选型</text>
