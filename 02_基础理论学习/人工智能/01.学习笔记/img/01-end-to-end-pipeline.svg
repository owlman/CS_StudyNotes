<rect x="530" y="582" width="255" height="58" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="657.5" y="607" class="t-name" text-anchor="middle">Ollama 后端</text>
