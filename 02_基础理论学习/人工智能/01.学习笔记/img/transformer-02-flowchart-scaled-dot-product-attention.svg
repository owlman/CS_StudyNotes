<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', sans-serif">
  <title>图 2　从输入序列 X 到 Q、K、V，以及缩放点积注意力的四个计算步骤</title>
  <desc>左侧展示输入序列 X 经三个可学习线性变换得到 Q、K、V 及其形状，右侧展示相似度计算、缩放、归一化、加权求和四个步骤</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97A47"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A8AAA"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#F5E6C8"/>

  <text x="800" y="66" font-size="42" font-weight="700" text-anchor="middle" fill="#6B4423">从输入序列 X 到缩放点积注意力</text>
  <line x1="560" y1="88" x2="1040" y2="88" stroke="#D97A47" stroke-width="3" stroke-linecap="round"/>
  <text x="800" y="122" font-size="22" text-anchor="middle" fill="#8B6F47">左侧是 Q、K、V 的来源与形状，右侧是四个计算步骤</text>

  <!-- 左侧：输入与投影 -->
  <rect x="60" y="150" width="345" height="560" rx="14" fill="#FFF8E8" stroke="#5A8AAA" stroke-width="3"/>
  <text x="232" y="200" font-size="27" font-weight="700" text-anchor="middle" fill="#5A8AAA">输入序列 X</text>
  <text x="232" y="243" font-size="23" text-anchor="middle" fill="#6B4423">X ∈ ℝ<tspan baseline-shift="super" font-size="15">n×d</tspan></text>
  <text x="232" y="275" font-size="20" text-anchor="middle" fill="#8B6F47">n 个位置，模型维度 d</text>

  <line x1="95" y1="298" x2="370" y2="298" stroke="#8B6F47" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="232" y="332" font-size="22" font-weight="700" text-anchor="middle" fill="#6B4423">三个可学习线性变换</text>

  <text x="95" y="383" font-size="23" fill="#6B4423">Q = X · W<tspan baseline-shift="super" font-size="15">Q</tspan></text>
  <text x="370" y="383" font-size="22" text-anchor="end" fill="#5A8AAA">n × d<tspan baseline-shift="sub" font-size="15">k</tspan></text>
  <text x="95" y="427" font-size="23" fill="#6B4423">K = X · W<tspan baseline-shift="super" font-size="15">K</tspan></text>
  <text x="370" y="427" font-size="22" text-anchor="end" fill="#5A8AAA">n × d<tspan baseline-shift="sub" font-size="15">k</tspan></text>
  <text x="95" y="471" font-size="23" fill="#6B4423">V = X · W<tspan baseline-shift="super" font-size="15">V</tspan></text>
  <text x="370" y="471" font-size="22" text-anchor="end" fill="#8E6C8A">n × d<tspan baseline-shift="sub" font-size="15">v</tspan></text>

  <line x1="95" y1="497" x2="370" y2="497" stroke="#8B6F47" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="232" y="533" font-size="21" text-anchor="middle" fill="#8B6F47">d<tspan baseline-shift="sub" font-size="14">k</tspan>：键向量维度</text>
  <text x="232" y="567" font-size="21" text-anchor="middle" fill="#8B6F47">d<tspan baseline-shift="sub" font-size="14">v</tspan>：值向量维度</text>

  <rect x="95" y="594" width="275" height="86" rx="10" fill="#E8F0F5" stroke="#5A8AAA" stroke-width="2"/>
  <text x="232" y="628" font-size="22" font-weight="700" text-anchor="middle" fill="#5A8AAA">自注意力中</text>
  <text x="232" y="666" font-size="25" font-weight="700" text-anchor="middle" fill="#6B4423">d<tspan baseline-shift="sub" font-size="16">v</tspan> = d<tspan baseline-shift="sub" font-size="16">k</tspan></text>

  <text x="232" y="702" font-size="19" text-anchor="middle" fill="#8B6F47" font-style="italic">n 个位置同时计算</text>

  <!-- 右侧：四个步骤 -->
  <rect x="470" y="150" width="1070" height="125" rx="14" fill="#FFF8E8" stroke="#D97A47" stroke-width="3"/>
  <circle cx="530" cy="212" r="26" fill="#D97A47"/>
  <text x="530" y="222" font-size="28" font-weight="700" text-anchor="middle" fill="#FFF8E8">1</text>
  <text x="580" y="198" font-size="28" font-weight="700" fill="#6B4423">相似度计算</text>
  <text x="580" y="238" font-size="20" fill="#8B6F47">每个位置向所有位置发出查询，接收相关性分数</text>
  <text x="1510" y="222" font-size="26" text-anchor="end" fill="#D97A47">QK<tspan baseline-shift="super" font-size="17">T</tspan></text>
  <line x1="530" y1="279" x2="530" y2="301" stroke="#D97A47" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/>

  <rect x="470" y="305" width="1070" height="125" rx="14" fill="#FFF8E8" stroke="#5A8AAA" stroke-width="3"/>
  <circle cx="530" cy="367" r="26" fill="#5A8AAA"/>
  <text x="530" y="377" font-size="28" font-weight="700" text-anchor="middle" fill="#FFF8E8">2</text>
  <text x="580" y="353" font-size="28" font-weight="700" fill="#6B4423">缩放</text>
  <text x="580" y="393" font-size="20" fill="#8B6F47">除以 √d<tspan baseline-shift="sub" font-size="14">k</tspan>，把点积方差拉回稳定区间</text>
  <text x="1510" y="377" font-size="26" text-anchor="end" fill="#5A8AAA">÷ √d<tspan baseline-shift="sub" font-size="17">k</tspan></text>
  <line x1="530" y1="434" x2="530" y2="456" stroke="#5A8AAA" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/>

  <rect x="470" y="460" width="1070" height="125" rx="14" fill="#FFF8E8" stroke="#7A8C6F" stroke-width="3"/>
  <circle cx="530" cy="522" r="26" fill="#7A8C6F"/>
  <text x="530" y="532" font-size="28" font-weight="700" text-anchor="middle" fill="#FFF8E8">3</text>
  <text x="580" y="508" font-size="28" font-weight="700" fill="#6B4423">归一化</text>
  <text x="580" y="548" font-size="20" fill="#8B6F47">逐行 softmax，得到和为 1 的注意力权重</text>
  <text x="1510" y="532" font-size="26" text-anchor="end" fill="#7A8C6F">softmax( · )</text>
  <line x1="530" y1="589" x2="530" y2="611" stroke="#7A8C6F" stroke-width="3" stroke-linecap="round" marker-end="url(#arw)"/>

  <rect x="470" y="615" width="1070" height="125" rx="14" fill="#FFF8E8" stroke="#8E6C8A" stroke-width="3"/>
  <circle cx="530" cy="677" r="26" fill="#8E6C8A"/>
  <text x="530" y="687" font-size="28" font-weight="700" text-anchor="middle" fill="#FFF8E8">4</text>
  <text x="580" y="663" font-size="28" font-weight="700" fill="#6B4423">加权求和</text>
  <text x="580" y="703" font-size="20" fill="#8B6F47">用权重对 V 加权，得到新的上下文表示</text>
  <text x="1510" y="687" font-size="26" text-anchor="end" fill="#8E6C8A">Σ<tspan baseline-shift="sub" font-size="15">j</tspan> α<tspan baseline-shift="sub" font-size="15">ij</tspan> · v<tspan baseline-shift="sub" font-size="15">j</tspan></text>

  <line x1="408" y1="300" x2="463" y2="300" stroke="#5A8AAA" stroke-width="3" stroke-linecap="round" marker-end="url(#arwb)"/>

  <rect x="470" y="760" width="1070" height="80" rx="14" fill="#E8F0F5" stroke="#5A8AAA" stroke-width="3"/>
  <text x="1005" y="810" font-size="26" text-anchor="middle" fill="#6B4423">输出：每个位置得到融合了全序列信息的上下文表示</text>

  <text x="800" y="880" font-size="20" text-anchor="middle" fill="#8B6F47" font-style="italic">Vaswani et al., Attention Is All You Need (2017)</text>
</svg>
