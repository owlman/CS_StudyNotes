# 加速版训练配置（CPU 6核 + cutoff_len 256）
# 相比原配置(512/单步18min+)目标将 6 步总耗时压到 1 小时内
model_name_or_path: Qwen/Qwen2.5-0.5B
dataset: lunyu_sample
dataset_dir: data
template: qwen
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0
lora_target: all
stage: sft
do_train: true
output_dir: saves\Qwen2.5-0.5B\lora\train_lunyu_sample_fast
overwrite_output_dir: true
cutoff_len: 256
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 0.0001
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 0
max_grad_norm: 1.0
logging_steps: 1
save_steps: 6
plot_loss: true
preprocessing_num_workers: 6
dataloader_num_workers: 4
flash_attn: auto
bf16: false
fp16: false
gradient_checkpointing: false
optim: adamw_torch
packing: false
enable_thinking: false
report_to: none
trust_remote_code: true
seed: 42
