<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', sans-serif">
  <!-- 背景 -->
  <rect width="1600" height="900" fill="#F5E6C8"/>

  <!-- 顶部标题 -->
  <text x="800" y="70" font-size="44" font-weight="700" text-anchor="middle" fill="#6B4423">专用 AI 与通用 AI 不是一回事</text>
  <line x1="600" y1="92" x2="1000" y2="92" stroke="#D97A47" stroke-width="3" stroke-linecap="round"/>

  <!-- 中间虚线分隔 -->
  <line x1="800" y1="130" x2="800" y2="820" stroke="#8B6F47" stroke-width="3" stroke-dasharray="10,8"/>
  <circle cx="800" cy="450" r="36" fill="#F5E6C8" stroke="#D97A47" stroke-width="2"/>
  <text x="800" y="460" font-size="28" font-weight="700" text-anchor="middle" fill="#D97A47">vs.</text>

  <!-- ============ 左栏: 专用 AI ============ -->
  <text x="400" y="160" font-size="38" font-weight="700" text-anchor="middle" fill="#6B4423">专用 AI</text>
  <text x="400" y="195" font-size="20" text-anchor="middle" fill="#8B6F47">(围棋 / 国际象棋类)</text>

  <!-- 要点 1: 围棋图标 + 文字 -->
  <g transform="translate(80,230)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#6B4423" stroke-width="3" rx="6"/>
    <line x1="0" y1="33" x2="100" y2="33" stroke="#6B4423" stroke-width="1.5"/>
    <line x1="0" y1="66" x2="100" y2="66" stroke="#6B4423" stroke-width="1.5"/>
    <line x1="33" y1="0" x2="33" y2="100" stroke="#6B4423" stroke-width="1.5"/>
    <line x1="66" y1="0" x2="66" y2="100" stroke="#6B4423" stroke-width="1.5"/>
    <circle cx="33" cy="33" r="9" fill="#2C2C2C"/>
    <circle cx="66" cy="66" r="9" fill="#F5E6C8" stroke="#2C2C2C" stroke-width="2"/>
    <circle cx="33" cy="66" r="9" fill="#2C2C2C"/>
    <text x="180" y="40" font-size="26" fill="#6B4423" font-weight="600">封闭环境 · 规则明确</text>
    <text x="180" y="75" font-size="18" fill="#8B6F47">棋盘边框即世界边界</text>
  </g>

  <!-- 要点 2: 公式图标 -->
  <g transform="translate(80,360)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#6B4423" stroke-width="3" rx="6"/>
    <text x="50" y="68" font-size="44" font-weight="700" text-anchor="middle" fill="#6B4423">f(x)=0</text>
    <text x="180" y="40" font-size="26" fill="#6B4423" font-weight="600">形式化输入 · 可完整表示</text>
    <text x="180" y="75" font-size="18" fill="#8B6F47">一切状态可被符号化</text>
  </g>

  <!-- 要点 3: 奖杯图标 -->
  <g transform="translate(80,490)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#6B4423" stroke-width="3" rx="6"/>
    <path d="M 35 30 L 35 60 Q 35 80 50 80 Q 65 80 65 60 L 65 30 Z" fill="none" stroke="#D97A47" stroke-width="3"/>
    <path d="M 35 35 Q 20 35 20 50 Q 20 60 35 60" fill="none" stroke="#D97A47" stroke-width="3"/>
    <path d="M 65 35 Q 80 35 80 50 Q 80 60 65 60" fill="none" stroke="#D97A47" stroke-width="3"/>
    <rect x="40" y="80" width="20" height="6" fill="#D97A47"/>
    <text x="180" y="40" font-size="26" fill="#6B4423" font-weight="600">胜负客观 · 可量化评价</text>
    <text x="180" y="75" font-size="18" fill="#8B6F47">输赢判据一目了然</text>
  </g>

  <!-- 要点 4: 底部小结 -->
  <g transform="translate(80,640)">
    <rect x="0" y="0" width="640" height="80" fill="#EFE0BD" stroke="#D97A47" stroke-width="2" rx="8"/>
    <text x="320" y="35" font-size="22" font-weight="700" text-anchor="middle" fill="#6B4423">领域专精 · 跨域即失效</text>
    <text x="320" y="62" font-size="18" text-anchor="middle" fill="#8B6F47">会下围棋 ≠ 能下国际象棋,更别说开车</text>
  </g>

  <!-- ============ 右栏: 通用 AI ============ -->
  <text x="1200" y="160" font-size="38" font-weight="700" text-anchor="middle" fill="#6B4423">通用 AI</text>
  <text x="1200" y="195" font-size="20" text-anchor="middle" fill="#8B6F47">(开放世界)</text>

  <!-- 要点 1: 打开的门 -->
  <g transform="translate(880,230)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#6B4423" stroke-width="3" rx="6"/>
    <rect x="15" y="20" width="30" height="65" fill="none" stroke="#6B4423" stroke-width="2"/>
    <rect x="55" y="20" width="30" height="65" fill="none" stroke="#6B4423" stroke-width="2"/>
    <line x1="45" y1="20" x2="45" y2="85" stroke="#6B4423" stroke-width="2"/>
    <text x="180" y="40" font-size="26" fill="#6B4423" font-weight="600">开放环境 · 规则不全</text>
    <text x="180" y="75" font-size="18" fill="#8B6F47">世界没有边界,规则也不可枚举</text>
  </g>

  <!-- 要点 2: 乱麻线条 -->
  <g transform="translate(880,360)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#6B4423" stroke-width="3" rx="6"/>
    <path d="M 20 30 Q 35 10 50 35 T 80 50 Q 60 70 30 55 T 70 80" fill="none" stroke="#B85450" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 25 70 Q 45 50 55 75 T 85 60" fill="none" stroke="#B85450" stroke-width="2" stroke-linecap="round"/>
    <text x="180" y="40" font-size="26" fill="#6B4423" font-weight="600">状态难完整表示</text>
    <text x="180" y="75" font-size="18" fill="#8B6F47">现实无法被一张图穷尽</text>
  </g>

  <!-- 要点 3: 问号眼睛 -->
  <g transform="translate(880,490)">
    <rect x="0" y="0" width="100" height="100" fill="none" stroke="#6B4423" stroke-width="3" rx="6"/>
    <ellipse cx="50" cy="50" rx="28" ry="18" fill="none" stroke="#6B4423" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="6" fill="#6B4423"/>
    <text x="50" y="28" font-size="22" font-weight="700" text-anchor="middle" fill="#B85450">?</text>
    <text x="180" y="40" font-size="26" fill="#6B4423" font-weight="600">评价主观 · 多元难量化</text>
    <text x="180" y="75" font-size="18" fill="#8B6F47">"做得好不好"见仁见智</text>
  </g>

  <!-- 要点 4: 底部小结 -->
  <g transform="translate(880,640)">
    <rect x="0" y="0" width="640" height="80" fill="#E0EBF2" stroke="#5A8AAA" stroke-width="2" rx="8"/>
    <text x="320" y="35" font-size="22" font-weight="700" text-anchor="middle" fill="#3D5A75">持续感知 · 规划 · 执行 · 负责</text>
    <text x="320" y="62" font-size="18" text-anchor="middle" fill="#5A8AAA">在开放世界里完成任务并兜底</text>
  </g>

  <!-- 底部脚注 -->
  <text x="800" y="850" font-size="20" text-anchor="middle" fill="#8B6F47" font-style="italic">围棋战胜人类 ≠ 通用智能。真正的通用 AI 还要走很远。</text>
</svg>